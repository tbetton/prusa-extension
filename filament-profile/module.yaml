# Filament Profile writes PrusaSlicer 2.9 filament profiles for the spools
# loaded on a printer's tools. It reads the profiles Prusa Research publishes
# and writes a Config Bundle (.ini) to import in PrusaSlicer.

name: filament-profile
kind: sink
version: 0.5.0
license: MIT
title: Filament Profile
summary: Write PrusaSlicer 2.9 filament profiles for the spools loaded on a printer.
codeowner: tbetton
contract_major: 1
openapi: openapi.json
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_amd64
  - darwin_arm64
  - windows_amd64
  - windows_arm64

require:
  core: ">=0.1.0-beta.1"

# Every connection the process makes outside Prusa Connect.
egress:
  - option: catalogue_url
    why: Downloads the filament and printer profiles Prusa Research publishes for PrusaSlicer 2.x.
    sends: Only the request for the archive.
  - option: polymaker_url
    why: Downloads the filament presets Polymaker publishes for PrusaSlicer, when the polymaker source is enabled.
    sends: Only the request for the archive.
  - host: codeload.github.com
    why: GitHub serves the Polymaker archive from there after a redirect.
    sends: Only the request for the archive.
  - option: custom_urls
    why: Downloads the PrusaSlicer config bundles the operator names, when the custom source is enabled.
    sends: Only the request for each bundle.

options:
  - key: catalogue_url
    type: string
    default: "https://storage.googleapis.com/prusa3d-content-prod-14e8-preset-repo-api-public/prusa-fff/prusa-fff-offline.zip"
    summary: Address of the Prusa Research profile archive for PrusaSlicer 2.x.
  - key: refresh_days
    type: int
    default: "7"
    summary: Days before the downloaded profiles are fetched again.
  - key: sources
    type: string
    default: "prusa,polymaker"
    summary: "The sources of filament presets to offer, separated by commas: prusa, polymaker, custom. The Prusa bundle is always loaded, for the printers and the generic presets; without prusa here, its own presets are not offered."
  - key: polymaker_url
    type: string
    default: "https://github.com/Polymaker3D/Polymaker-Preset/archive/refs/heads/main.zip"
    summary: The https address of the repository archive of Polymaker's presets, for the polymaker source.
  - key: custom_urls
    type: string
    default: ""
    summary: "For the custom source: https addresses of PrusaSlicer config bundles (.ini with [filament:...] sections), separated by commas, at most 8."

needs:
  memory_mib: 128
  # The downloaded bundle is kept here.
  data: true

ui:
  entry: ui/index.js
  library: ">=0.1.0 <1.0.0"
  contributes:
    device_tab:
      - id: filament-profile
        title: Filament Profile
